plugins { id 'com.android.application' }
android { namespace 'it.atomogentile.nogar'; compileSdk 35
 defaultConfig { applicationId 'it.atomogentile.nogar'; minSdk 28; targetSdk 35; versionCode 9; versionName '0.9.0' }
 testOptions { unitTests.all { systemProperty 'nogar.repository', rootProject.projectDir.absolutePath; inputs.property 'firebaseEmulatorHost', System.getenv('FIREBASE_DATABASE_EMULATOR_HOST') ?: '' } }
 buildTypes { release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
}

dependencies {
 implementation 'io.github.webrtc-sdk:android:150.7871.04'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
}
