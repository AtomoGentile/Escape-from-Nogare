name: Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: android-actions/setup-android@v3
      - name: Install exact Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Report build tool versions
        run: |
          java -version
          node --version
          ./gradlew --version
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Server and interface tests
        run: npm test
      - name: Build Android APK
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug
      - name: Android lint
        run: ./gradlew --no-daemon --max-workers=2 :app:lintDebug
      - name: Verify signature and size
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          test "$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)" -lt 100000000
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: nogar-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: android-reports
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
