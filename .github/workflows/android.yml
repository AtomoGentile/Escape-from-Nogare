name: Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Ubuntu 24.04 already contains the required SDK. Do not reinstall the
      # legacy `tools` package through setup-android's default package list.
      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v4
      - name: Report build tool versions
        run: |
          java -version
          node --version
          ./gradlew --version
      - name: Validate Windows helper syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem tools/windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
            Write-Host "Parsed $($_.Name)"
          }
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Server and interface tests
        run: npm test
      - name: Firebase emulator security and REST integration
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          set +e
          npm run test:firebase:ci > firebase-emulator-ci.log 2>&1
          result=$?
          cat firebase-emulator-ci.log
          if [ "$result" -ne 0 ]; then
            python - <<'PYERROR'
          from pathlib import Path
          text = Path('firebase-emulator-ci.log').read_text(errors='replace')[-10000:]
          print('::error title=Firebase emulator tests::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYERROR
          fi
          exit "$result"
      - name: Build Android APK
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug
      - name: Phone and PC authority and encryption tests
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest
      - name: Android lint
        run: ./gradlew --no-daemon --max-workers=2 :app:lintDebug
      - name: Verify signature and size
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          test "$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)" -lt 100000000
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: nogar-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: android-reports
          path: |
            app/build/reports/
            build/reports/
            firebase-emulator-ci.log
          if-no-files-found: ignore
