name: Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Server and interface tests
        run: npm test
      - name: Build and lint Android
        run: gradle --no-daemon --max-workers=2 :app:assembleDebug :app:lintDebug
      - name: Enforce APK size below 100 MB
        run: test "$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)" -lt 100000000
      - uses: actions/upload-artifact@v4
        with:
          name: nogar-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
