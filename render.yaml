# Demo hosting: the free service can sleep/restart and loses encrypted connection mailboxes.
# Review the selected plan in Render before deploying.
services:
  - type: web
    name: nogar-relay
    runtime: node
    plan: free
    rootDir: server
    buildCommand: node --check relay.mjs
    startCommand: node relay.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
